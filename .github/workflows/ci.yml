name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26 # Apple silicon, Xcode 26 SDK (Liquid Glass APIs)
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build -c release
      # Tests that need a downloaded model are skipped on CI; kernels run on the runner's GPU.
      - run: swift test
      - run: scripts/bundle.sh
